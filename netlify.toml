# DÉPLOIEMENT NETLIFY — lu automatiquement quand le dépôt est connecté à un site
# ("Import an existing project"). Il n'y a alors RIEN à configurer dans
# l'interface : un push sur `main` déclenche `npm run build` et publie `dist/`.
#
# ⚠ Ce fichier ne sert QUE pour le déploiement par Git. Un dépôt déposé à la main
# (Netlify Drop) publie le contenu du zip tel quel — le zip est fabriqué à partir
# de `dist/`, ce fichier vit à la racine du dépôt, il n'y entre donc jamais.
#
# ⚠ PAS DE REDIRECTION FOURRE-TOUT (`/* /index.html 200`). Le jeu est MONO-PAGE
# sans routeur : aucune URL profonde à rattraper. En poser une transformerait
# chaque asset manquant en page HTML servie avec un code 200 — le sprite ne
# s'afficherait pas et le 404 qui l'aurait expliqué disparaîtrait. Le jour où une
# vraie route apparaît, c'est trois lignes à ajouter ici.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Épinglé sur la version qui construit la maison : Node 24, comme le poste de
  # dev et la CI (.github/workflows/ci.yml), au-dessus du plancher d'Electron 42
  # (>= 22.12, `engines` de package.json — audit 2026-10-05, TEST-15). Sans ça on
  # hérite du défaut de Netlify, qui bouge sans prévenir, et un build qui casse
  # six mois plus tard sans qu'on ait rien touché coûte une soirée à diagnostiquer.
  NODE_VERSION = "24"
  # (Pas d'ELECTRON_SKIP_BINARY_DOWNLOAD : Electron 42 ne télécharge plus son
  # binaire à l'installation, cf. .github/workflows/ci.yml.)

# EN-TÊTES DE CACHE (audit 2026-10-05, WEB-1) : PAS ICI, dans public/_headers.
# Ce fichier-là part DANS dist/ — il vaut donc aussi pour le zip déposé à la
# main (Netlify Drop, scripts/zipDist.mjs), que ce netlify.toml ne suit pas.
